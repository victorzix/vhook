openapi: 3.1.0

info:
  title: vhook
  version: 0.0.0 # x-release-please-version
  description: |
    Webhook dispatcher. Duas superfícies com autenticação distinta:

    - **Ingress** — pública, chamada por produtores, autenticada por chave da application.
    - **Management** — interna, consumida pelo dashboard, autenticada por token administrativo.

    Erros nunca carregam mensagem: só código, `correlation_id` e `details`.
    O consumidor traduz o código pelo catálogo. Ver `docs/ERRORS.md`.

servers:
  - url: http://localhost:8080
    description: desenvolvimento

# O servidor é a raiz, não `/v1`: as rotas operacionais abaixo vivem fora do
# prefixo de versão, e um servidor com `/v1` embutido não conseguiria descrevê-las
# sem sobrescrita por caminho — que o gerador de servidor ignora.
#
# As operações são adicionadas pela spec que as introduz.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness
      description: |
        Diz apenas que o processo responde. **Nunca consulta dependência** — um
        blip do Postgres não pode fazer o orquestrador matar um processo saudável.
        Prontidão é `/readyz`.
      security: []
      responses:
        '200':
          description: O processo está vivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness
      description: |
        Verifica as dependências em ordem fixa — `postgres`, depois `rabbitmq` —
        com timeout de 2s cada. Passa a responder 503 assim que o sinal de
        término chega, antes de o servidor parar de aceitar conexão.
      security: []
      responses:
        '200':
          description: Pronta para servir
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /metrics:
    get:
      operationId: getMetrics
      summary: Métricas Prometheus
      description: |
        Formato de exposição Prometheus. Coletas padrão do runtime Go mais
        `vhook_build_info{version,commit}`. Nenhuma métrica leva `application_id`.
      security: []
      responses:
        '200':
          description: Métricas no formato de exposição Prometheus
          content:
            text/plain:
              schema:
                type: string

  # O tenant vai no caminho, nunca implícito nem em header — ver §4.34.
  # Com escopo no caminho, esquecê-lo é impossível: a URL não se constrói sem
  # ele. E a query do detalhe vira `WHERE id = $1 AND application_id = $2`,
  # então recurso de outro tenant devolve 404 sem confirmar que existe.
  /v1/applications/{application_id}/endpoints:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      operationId: listEndpoints
      summary: Lista os endpoints de uma application
      description: |
        Não devolve o `secret`. Revelá-lo é permitido quantas vezes se quiser
        (§4.28), mas a listagem é a resposta que mais aparece em tela, em cache
        de front e em log de proxy — o detalhe é o lugar de revelar.

        Sem paginação: o plano free permite 2 endpoints por application.
      security:
        - AdminToken: []
      responses:
        '200':
          description: Os endpoints da application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      operationId: createEndpoint
      summary: Cadastra um endpoint
      description: |
        Gera o secret, valida a URL contra faixas privadas e link-local, e
        devolve o secret em claro — a única resposta que o traz junto da criação.

        A validação de SSRF aqui é conveniência e defesa em profundidade, **não**
        a garantia: o DNS pode mudar depois do cadastro. A checagem que sustenta
        a garantia é no disparo, sobre o IP que a conexão vai usar.
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEndpointRequest'
      responses:
        '201':
          description: Endpoint criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointWithSecret'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /v1/applications/{application_id}/endpoints/{endpoint_id}:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
      - $ref: '#/components/parameters/EndpointId'
    get:
      operationId: getEndpoint
      summary: Detalha um endpoint, com o secret
      description: |
        Traz o `secret`. §4.28 permite revelá-lo quantas vezes se quiser: sem
        rotação, perdê-lo obrigaria a recriar o endpoint e reconfigurar o
        cliente. Muda para revelar-uma-vez quando a rotação existir.
      security:
        - AdminToken: []
      responses:
        '200':
          description: O endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointWithSecret'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      operationId: updateEndpoint
      summary: Altera a URL de um endpoint
      description: |
        Só a `url` é mutável, e a mudança revalida SSRF. Existe para que
        corrigir um erro de digitação não exija recriar o endpoint — o que
        geraria secret novo e obrigaria o cliente a se reconfigurar.

        `status` não é mutável aqui: ativar e desativar é ciclo de vida, e
        pertence à spec do circuit breaker junto com a desativação automática.
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEndpointRequest'
      responses:
        '200':
          description: Endpoint alterado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  securitySchemes:
    ApplicationApiKey:
      type: http
      scheme: bearer
      description: Chave da application. Usada apenas no ingress.

    AdminToken:
      type: http
      scheme: bearer
      description: |
        Token administrativo. Usado apenas no management, e apenas
        server-side pelo BFF do dashboard — nunca chega ao browser.

  parameters:
    ApplicationId:
      name: application_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApplicationId'
      description: |
        A application dona do recurso. Hoje o BFF passa o valor único vindo do
        bootstrap; quando houver login, passa o da sessão do usuário. A API não
        vê diferença — é o que torna login plugável sem reescrever rota (§4.34).

    EndpointId:
      name: endpoint_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EndpointId'

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
      description: |
        Reenvio com a mesma chave na mesma application não cria evento novo:
        responde 202 com o `event_id` existente.

    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: |
        Paginação keyset sobre `(created_at, id)`. Opaco para o cliente.

  schemas:
    # Identificadores: UUIDv7 no banco, prefixo + base32 na borda (§4.31).
    # O prefixo faz um id de outro recurso virar erro de validação nomeado,
    # em vez de um 404 sem explicação.
    ApplicationId:
      type: string
      pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
      examples:
        - app_01J4PMX3R0E008000000000002

    EndpointId:
      type: string
      pattern: '^ept_[0-9A-HJKMNP-TV-Z]{26}$'
      examples:
        - ept_01J4PMX3R0E008000000000003

    EndpointStatus:
      type: string
      enum: [active, disabled]
      description: |
        `disabled` só é alcançável pelo circuit breaker, que ainda não existe.
        Nenhuma rota desta versão escreve neste campo.

    Endpoint:
      type: object
      required: [id, url, status, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/EndpointId'
        url:
          type: string
          format: uri
          examples:
            - https://api.cliente.com/hooks
        status:
          $ref: '#/components/schemas/EndpointStatus'
        created_at:
          type: string
          format: date-time

    # Campos repetidos em vez de `allOf` com Endpoint: composição gera nome de
    # tipo imprevisível, e este contrato prefere geração determinística a
    # contrato DRY — o mesmo motivo que promoveu ReadyChecks a schema nomeado.
    EndpointWithSecret:
      type: object
      required: [id, url, status, created_at, secret]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/EndpointId'
        url:
          type: string
          format: uri
        status:
          $ref: '#/components/schemas/EndpointStatus'
        created_at:
          type: string
          format: date-time
        secret:
          type: string
          pattern: '^whsec_[0-9A-Za-z]{43}$'
          description: |
            Chave do HMAC que o cliente usa para verificar a assinatura.
            Guardada cifrada com AES-GCM: o vhook precisa do valor em claro
            para assinar, então hasheá-la impossibilitaria a entrega (§4.12).
          examples:
            - whsec_zDccFjpqVDQHpyWI9SskzezueMASw60LLuaLOFjmD8H

    EndpointList:
      type: object
      required: [endpoints]
      additionalProperties: false
      properties:
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/Endpoint'

    CreateEndpointRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            Obrigatoriamente `https`. O destino é validado contra faixas
            privadas, loopback, link-local, CGNAT e os equivalentes IPv6,
            inclusive IPv4 mapeado.

            `http` fica de fora por ora: afrouxar depois não quebra nada,
            apertar depois quebraria todo endpoint já cadastrado.
          examples:
            - https://api.cliente.com/hooks

    UpdateEndpointRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048

    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]

    Ready:
      type: object
      required: [status, checks]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ready]
        checks:
          $ref: '#/components/schemas/ReadyChecks'

    ReadyChecks:
      type: object
      required: [postgres, rabbitmq]
      additionalProperties: false
      description: |
        Só aparece na resposta 200, e aí todas as dependências estão `ok`.
        Falha é expressa pelo envelope de erro: o `code` é o da primeira
        dependência a falhar na ordem de checagem, e `details` lista todas.

        Schema nomeado em vez de objeto embutido para que o nome do tipo
        gerado seja previsível — objeto anônimo faz o gerador inventar o nome.
      properties:
        postgres:
          type: string
          enum: [ok]
        rabbitmq:
          type: string
          enum: [ok]

    ErrorCode:
      type: string
      pattern: '^[A-Z]{3}-[A-Z]{3}-[0-9]{3}$'
      examples:
        - AUT-CRD-001
      description: |
        `MOD-TYP-NNN`. Contrato estável — pode ser usado em lógica de decisão.
        Ver `docs/ERRORS.md` para a taxonomia.

    ErrorDetail:
      type: object
      required: [field, code]
      additionalProperties: false
      properties:
        field:
          type: string
          description: |
            Campo do formulário, ou nome da sub-checagem quando o erro tem
            partes — em `/readyz`, `postgres` ou `rabbitmq`.
          examples:
            - url
        code:
          $ref: '#/components/schemas/ErrorCode'

    ErrorBody:
      type: object
      required: [code, correlation_id]
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        correlation_id:
          type: string
          description: |
            Liga esta resposta ao log estruturado. Obrigatório: como não
            há mensagem, é a única forma de investigar um caso relatado.
          examples:
            - 01HQZX3K7YB2N4M8P6R9T5V0W1
        details:
          type: array
          description: |
            Falhas por campo, para o dashboard destacar o formulário sem
            que o backend produza texto. Ausente quando não se aplica.
          items:
            $ref: '#/components/schemas/ErrorDetail'

    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

  responses:
    Unauthorized:
      description: Credencial ausente ou inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    UnprocessableEntity:
      description: Conteúdo bem-formado, mas inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: |
        Autenticado, mas sem direito ao que foi pedido — quota de plano
        esgotada, por exemplo.

        403 e não o 429 padrão do tipo `LMT`: 429 promete que tentar de novo
        mais tarde resolve, e uma quota de capacidade não se libera com o tempo.
        O cliente ficaria em retry eterno contra uma parede.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: |
        Recurso inexistente — ou existente e pertencente a outro tenant. As
        duas situações são indistinguíveis de fora **de propósito**: um 403
        confirmaria a existência do recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: |
        Conflito com o estado atual: já existe endpoint com essa URL nesta
        application. Dois endpoints com a mesma URL receberiam entregas
        idênticas em duplicata.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    TooManyRequests:
      description: Limite de rate ou quota do plano excedido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServiceUnavailable:
      description: |
        Dependência própria indisponível, ou desligamento em andamento.
        503 e não o 502 padrão do tipo `DEP`: 502 significa "recebi resposta ruim
        de um upstream", e aqui o caso é "não estou pronta para servir".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
